<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Ticari depo verisinin hazırlanması</title>
  <desc id="desc">Mendeley Data kayıtları UTC'ye çevrilir, doğrulanır, çiğ noktası ve DPU hesaplanır, sonra eğitim, doğrulama ve test bölümlerine ayrılır.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#35536a"/></marker></defs>
  <rect width="1000" height="320" fill="white"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#183349" text-anchor="middle">
    <text x="500" y="53" font-size="30" font-weight="700">Ticari depo verisinin hazırlanması</text>
    <g stroke="#35536a" fill="#eef4f8" stroke-width="2">
      <rect x="24" y="100" width="204" height="112" rx="10"/><rect x="268" y="100" width="204" height="112" rx="10"/>
      <rect x="512" y="100" width="204" height="112" rx="10"/><rect x="756" y="100" width="220" height="112" rx="10"/>
    </g>
    <g stroke="#35536a" stroke-width="2.5" marker-end="url(#arrow)"><path d="M232 156h29"/><path d="M476 156h29"/><path d="M720 156h29"/></g>
    <g font-size="20" font-weight="600"><text x="126" y="141">Kaynak kayıtlar</text><text x="370" y="141">Ölçüm doğrulama</text><text x="614" y="141">Hesaplama</text><text x="866" y="141">UTC bölümleme</text></g>
    <g font-size="17"><text x="126" y="173">Mendeley Data v2</text><text x="370" y="173">Zaman ve sensör alanları</text><text x="614" y="173">Çiğ noktası ve DPU</text><text x="866" y="173">T2–T3 / T4 / T5</text></g>
    <text x="500" y="258" font-size="18">Geçersiz ölçümlerin zamanları sonraki analiz için korunur.</text>
  </g>
</svg>
